name: Sync con NouTube original

# Cada semana revisa si el autor de NouTube saco cambios; si hay, los trae a
# este fork (como el boton "Sync fork") y manda a compilar la APK.
on:
  schedule:
    - cron: '17 3 * * 0' # domingo 3:17 UTC = sabado 9:17 pm El Salvador
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: traer cambios del original
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "::error::No se pudo sincronizar (probablemente hay conflicto con nuestros cambios). Pedile a Claude que lo arregle."
            exit 1
          fi
          TYPE=$(echo "$OUT" | jq -r '.merge_type')
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: compilar si hubo cambios
        if: steps.sync.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mi-apk.yml -R ${{ github.repository }} --ref main
