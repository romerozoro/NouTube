name: Mi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - name: install and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install

      - name: build apk
        run: ./gradlew assembleFullRelease
        working-directory: android

      - name: sign apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          TOOLS=/usr/local/lib/android/sdk/build-tools/$BT
          KEY=$(printf '%s' "$SIGNING_KEY" | sed 's/SIGNING_KEY://' | tr -d ' \r\n\t')
          echo "Largo de la llave: ${#KEY} (debe ser 3428)"
          printf '%s' "$KEY" | base64 -d > mi.jks
          OUT=android/app/build/outputs/apk/full/release
          sign() {
            IN=$(ls $OUT/*$1*-unsigned.apk | head -n 1)
            $TOOLS/zipalign -f -p 4 "$IN" aligned-$1.apk
            $TOOLS/apksigner sign --ks mi.jks --ks-pass "pass:$KEY_STORE_PASSWORD" --out "$2" aligned-$1.apk
          }
          sign arm64-v8a ChuTube.apk
          sign armeabi-v7a ChuTube-arm32.apk
          cp ChuTube.apk NouTube-mio.apk
          rm mi.jks

      - uses: actions/upload-artifact@v4
        with:
          name: NouTube-mio
          path: NouTube-mio.apk

      - name: publicar en Releases (link directo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "chutube-${{ github.run_number }}" ChuTube.apk ChuTube-arm32.apk \
            -R ${{ github.repository }} --target ${{ github.sha }} --latest \
            --title "ChuTube #${{ github.run_number }}" \
            --notes "ChuTube.apk = celulares (arm64). ChuTube-arm32.apk = equipos viejos o radios de carro de 32 bits."
