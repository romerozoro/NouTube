
name: Mi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - name: install and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install

      - name: build apk
        run: ./gradlew assembleFullRelease
        working-directory: android

      - name: sign apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          TOOLS=/usr/local/lib/android/sdk/build-tools/$BT
          echo "$SIGNING_KEY" | base64 -d > mi.jks
          IN=$(ls android/app/build/outputs/apk/full/release/*-unsigned.apk | head -n 1)
          $TOOLS/zipalign -f -p 4 "$IN" aligned.apk
          $TOOLS/apksigner sign --ks mi.jks --ks-pass "pass:$KEY_STORE_PASSWORD" --out NouTube-mio.apk aligned.apk
          rm mi.jks

      - uses: actions/upload-artifact@v4
        with:
          name: NouTube-mio
          path: NouTube-mio.apk
